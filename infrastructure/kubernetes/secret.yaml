apiVersion: v1
kind: Secret
metadata:
  name: vpn-secrets
  namespace: enterprise-vpn
type: Opaque
stringData:
  DATABASE_URL: "postgresql://vpn_user:CHANGE_ME@postgres:5432/enterprise_vpn"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "CHANGE_THIS_SECRET_KEY"
  ENCRYPTION_KEY: "CHANGE_THIS_ENCRYPTION_KEY"
  AD_SERVER: "ldap://ad.example.com:389"
  AD_BASE_DN: "dc=example,dc=com"
  AD_BIND_USER: "CHANGE_ME"
  AD_BIND_PASSWORD: "CHANGE_ME"
  RADIUS_SECRET: "CHANGE_ME"
  RADIUS_SERVER: "radius.example.com"

